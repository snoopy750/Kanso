plugins { id 'com.android.application' }
android {
    namespace 'ch.sinan.schlicht'
    compileSdk 34
    defaultConfig {
        applicationId 'ch.sinan.schlicht'
        minSdk 26
        targetSdk 34
        versionCode 10
        versionName '1.9'
    }
    signingConfigs {
        fest {
            storeFile file('schlicht.keystore')
            storePassword 'schlicht'
            keyAlias 'schlicht'
            keyPassword 'schlicht'
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.fest }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
